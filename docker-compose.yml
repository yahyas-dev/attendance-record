services:
  web:
    build: .
    container_name: techtest-api
    ports:
      - "8080:8000"
    volumes:
      - ./app:/code/api
    env_file: 
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: fastapi dev api/main.py --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techTestNetwork
  
  db:
    image: postgres:15-alpine
    container_name: techtest-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - techTestNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

networks:
  techTestNetwork:
    driver: bridge

volumes:
  db_data: